<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>云栖山寺</title></head>
<body>
  <main id="world" aria-label="山寺三维场景"></main>
  <section id="entry"><div class="entry-card"><div class="seal" aria-hidden="true">⛩</div><h1>云栖山寺</h1><p>沿着石阶进山，坐一会儿。</p><button id="enter">进入山寺</button><p id="entry-error" role="alert"></p></div></section>
  <div id="hud" hidden>
    <header>
      <div class="toolbar"><button id="exit">离开</button><button id="map">游览</button><button id="rooms">云栖山寺 <small id="room-label">01</small></button></div>
      <span id="online" aria-live="polite"></span>
      <nav class="toolbar"><button id="offerings">祈愿</button><button id="support" aria-label="供养">米</button><button id="ceremony">早晚课</button><button id="settings">设置</button></nav>
    </header>
    <button id="sound" aria-pressed="false">诵念</button>
    <p id="notice" role="status"></p>
    <footer><button id="stop-travel" hidden>停止移动</button><p class="hint">点击地面行走 · 拖动转向 · 滚轮缩放</p><div class="actions"><button id="greet">合掌 <kbd>3</kbd></button><button id="bow">礼拜 <kbd>1</kbd></button><button id="moktak">木鱼 <kbd>5</kbd></button><button id="beads">念珠 <kbd>2</kbd></button><button id="sit">落座</button></div></footer>
  </div>
  <dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><form method="dialog"><button aria-label="关闭">×</button></form></div><div id="dialog-content"></div></dialog>
  <script type="module" src="/src/main.mjs"></script>
</body>
</html>
